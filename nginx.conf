upstream my_nodejs_upstream {
  # Use a private IP for the Node.js server
  server 127.0.0.1:3001;

  # Lower keepalive to free connections faster
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name api.drditobgyn.com;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin"; # Extra header for security

  # Logging
  access_log /var/log/nginx/api.access.log;
  error_log /var/log/nginx/api.error.log;

  # Body Size and Timeouts
  client_max_body_size 100M;

  location / {
    # Proxy Settings
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $http_host;
    proxy_pass http://my_nodejs_upstream;
    proxy_http_version 1.1; # Ensure HTTP 1.1 for WebSockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect off;

    # Timeouts: Adjust to your application's needs
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    send_timeout 120s;
  }

  # GZIP Compression
  gzip on;
  gzip_types application/javascript application/json application/xml text/css text/plain image/svg+xml;
  gzip_comp_level 6;
  gzip_min_length 256; # Lower threshold to compress more content
  gzip_buffers 4 8k; # More efficient memory usage for buffers
  gzip_vary on;

  # Security: Hide dotfiles
  location ~ /\. {
    deny all;
  }

  # Security: Protect the .well-known directory (if needed)
  location ~ ^/\.well-known/ {
    allow all;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name drditobgyn.com;
  access_log /var/log/nginx/html.access.log;
  error_log /var/log/nginx/html.error.log; # Add error log

  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
  client_max_body_size 100M;

  root /var/www/5cloth/dist; # Replace with the actual path
  index index.html;

  # Error handling
  error_page 500 502 503 504 /50x.html;
  location / {
    root /var/www/5cloth/dist;
    index index.html;
    try_files $uri $uri/ /index.html;
  }
  location = /50x.html {
    root /usr/share/nginx/html;
  }

  # Gzip Compression (Optimized)
  gzip on;
  gzip_types text/css application/javascript image/svg+xml; # Removed less common types
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_buffers 16 8k;
  gzip_vary on;

  # Security
  location ~ /\.ht {
    deny all;
  }
}
