upstream apinodejs {
    # Use a private IP for the Node.js server
    server 127.0.0.1:3001;

    # Lower keepalive to free connections faster
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.drditobgyn.com;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin"; # Extra header for security

    # Logging
    access_log /var/log/nginx/api.access.log;
    error_log /var/log/nginx/api.error.log;

    # Body Size and Timeouts
    client_max_body_size 100M;

    location / {
        # Proxy Settings
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://apinodejs;
        proxy_http_version 1.1;  # Ensure HTTP 1.1 for WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;

        # Timeouts: Adjust to your application's needs
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;
    }

    # GZIP Compression
    gzip on;
    gzip_types application/javascript application/json application/xml text/css text/plain image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 256;  # Lower threshold to compress more content
    gzip_buffers 4 8k; # More efficient memory usage for buffers
    gzip_vary on;

    # Security: Hide dotfiles
    location ~ /\. {
        deny all;
    }

    # Security: Protect the .well-known directory (if needed)
    location ~ ^/\.well-known/ {
        allow all;
    }
}
